<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · LectureNote AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f1f5f9;
        }
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page has not been saved for offline reading. Notes you have opened before are still
        available — go back and open one, or try again when you are connected.
      </p>
    </main>
  </body>
</html>
